<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{modules/layout :: html(content = ~{::content}, showAside = false, pageTitle = (${theme.config.plugins?.equipments?.title} ?: '装备'), head = ~{::head})}"
>
  <th:block th:fragment="head"><th:block th:replace="~{modules/head :: equipments-head}" /></th:block>
  <th:block th:fragment="content">
    <div
      class="equipment-page"
      data-equipment-page
      data-view="shelf"
      th:with="currentGroup=${param.group != null and not #lists.isEmpty(param.group) ? param.group[0] : ''}"
    >
      <header class="equipment-heading">
        <div>
          <h1 class="text-creative" th:text="${theme.config.plugins?.equipments?.title} ?: '装备'">装备</h1>
          <p th:text="${theme.config.plugins?.equipments?.description} ?: '记录正在使用和推荐的设备、软件与工具'">
            记录正在使用和推荐的设备、软件与工具
          </p>
        </div>
        <span class="equipment-total" th:if="${equipments != null}"
          ><strong th:text="${equipments.total}">0</strong><span>件装备</span></span
        >
      </header>
      <div class="equipment-toolbar">
        <nav class="equipment-groups" aria-label="装备分组" th:if="${groups != null and not #lists.isEmpty(groups)}">
          <a th:href="@{/equipments}" th:attr="aria-current=${#strings.isEmpty(currentGroup) ? 'page' : null}">
            全部<span th:text="${#lists.size(equipmentFinder.listAll())}">0</span>
          </a>
          <a
            th:each="group : ${groups}"
            th:href="@{/equipments(group=${group.metadata.name})}"
            th:attr="aria-current=${currentGroup == group.metadata.name ? 'page' : null}"
          >
            <th:block th:text="${group.spec.displayName}">分组名称</th:block>
            <span
              th:text="${group.status?.equipmentCount != null ? group.status.equipmentCount : (group.equipments != null ? #lists.size(group.equipments) : 0)}"
              >0</span
            >
          </a>
        </nav>
        <div class="equipment-view" role="group" aria-label="展示方式" data-equipment-views hidden>
          <button type="button" data-equipment-view="shelf" aria-pressed="true" aria-label="展架视图" title="展架视图">
            <span class="icon-[ph--squares-four-bold]" aria-hidden="true"></span><span>展架</span>
          </button>
          <button type="button" data-equipment-view="list" aria-pressed="false" aria-label="清单视图" title="清单视图">
            <span class="icon-[ph--list-bullets-bold]" aria-hidden="true"></span><span>清单</span>
          </button>
        </div>
      </div>
      <p
        class="equipment-group-note"
        th:each="group : ${groups}"
        th:if="${currentGroup == group.metadata.name and not #strings.isEmpty(group.spec.description)}"
        th:text="${group.spec.description}"
      ></p>
      <ul
        class="equipment-shelf"
        th:if="${equipments != null and not #lists.isEmpty(equipments.items)}"
        aria-label="装备列表"
      >
        <li
          th:each="equipment : ${equipments.items}"
          class="equipment-card"
          data-equipment-item
          th:data-equipment-id="${equipment.metadata.name}"
          th:data-cover="${equipment.spec.cover}"
          th:data-url="${equipment.spec.url}"
        >
          <button
            type="button"
            class="equipment-open"
            data-equipment-open
            aria-haspopup="dialog"
            aria-controls="equipment-detail-dialog"
            th:aria-label="|查看 ${equipment.spec.displayName} 详情|"
          >
            <span class="equipment-media" th:classappend="${#strings.isEmpty(equipment.spec.cover) ? 'is-empty' : ''}">
              <img
                th:if="${not #strings.isEmpty(equipment.spec.cover)}"
                th:src="${equipment.spec.cover}"
                alt=""
                loading="lazy"
                decoding="async"
                referrerpolicy="no-referrer"
              />
              <span class="equipment-placeholder icon-[ph--cube-light]" aria-hidden="true"></span>
              <span class="equipment-peek" aria-hidden="true"
                ><span class="icon-[ph--arrows-out-simple-bold]"></span
              ></span>
            </span>
            <span class="equipment-caption">
              <span
                class="equipment-category"
                th:each="group : ${groups}"
                th:if="${group.metadata.name == equipment.spec.groupName}"
                th:text="${group.spec.displayName}"
              ></span>
              <strong class="equipment-name" th:text="${equipment.spec.displayName}">装备名称</strong>
              <span
                class="equipment-spec"
                th:if="${not #strings.isEmpty(equipment.spec.specification)}"
                th:text="${equipment.spec.specification}"
              ></span>
              <span
                class="equipment-description"
                th:if="${not #strings.isEmpty(equipment.spec.description)}"
                th:text="${equipment.spec.description}"
              ></span>
              <span class="equipment-detail-hint" aria-hidden="true"
                >查看详情<span class="icon-[ph--arrow-up-right-bold]"></span
              ></span>
            </span>
          </button>
        </li>
      </ul>
      <div class="equipment-empty" th:if="${equipments == null or #lists.isEmpty(equipments.items)}">
        <span class="icon-[ph--cube-light]" aria-hidden="true"></span>
        <h2>这里还没有装备</h2>
        <p>设备、软件和工具，慢慢收集在这里。</p>
        <a th:if="${not #strings.isEmpty(currentGroup)}" th:href="@{/equipments}"
          >查看全部装备<span class="icon-[ph--arrow-right-bold]"></span
        ></a>
      </div>
      <th:block th:if="${equipments != null}" th:replace="~{modules/pagination :: pagination(data=${equipments})}" />
      <th:block th:replace="~{modules/equipments/detail :: detail}" />
    </div>
  </th:block>
</html>
