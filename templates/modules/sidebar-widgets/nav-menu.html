<!-- 导航菜单组件 -->
<th:block
  th:fragment="nav-menu"
  th:with="
    menu = ${multiSiteMenuFinder != null
      ? multiSiteMenuFinder.getCurrent()
      : (not #strings.isEmpty(theme.config.header.primary_menu) ? menuFinder.getByName(theme.config.header.primary_menu) : null)},
    currentPath = ${#httpServletRequest.requestURI}"
>
  <menu th:if="${menu != null and menu.menuItems != null}">
    <li
      th:each="menuItem : ${menu.menuItems}"
      th:class="${menuItem.children != null and not #lists.isEmpty(menuItem.children)} ? 'has-submenu' : ''"
    >
      <th:block th:if="${menuItem.children != null and not #lists.isEmpty(menuItem.children)}">
        <div class="nav-item-wrapper">
          <a
            th:class="${currentPath != null and menuItem.status?.href != null and (currentPath == menuItem.status.href or #strings.endsWith(menuItem.status.href, currentPath)) ? 'sidebar-nav-item has-dropdown active' : 'sidebar-nav-item has-dropdown'}"
            th:href="@{${menuItem.status.href}}"
            th:target="${menuItem.spec.target?.value}"
          >
            <img
              th:if="${not #strings.isEmpty(menuItem.metadata?.annotations?.get('icon'))}"
              th:src="${menuItem.metadata.annotations.get('icon')}"
              alt=""
            />
            <span class="nav-text" th:text="${menuItem.status.displayName}"></span>
          </a>
          <button type="button" class="dropdown-toggle" aria-label="Toggle dropdown">
            <span class="icon-[ph--caret-down-bold] dropdown-arrow"></span>
          </button>
        </div>

        <div class="dropdown-menu">
          <a
            th:each="child : ${menuItem.children}"
            th:href="@{${child.status.href}}"
            th:class="${currentPath != null and child.status?.href != null and (currentPath == child.status.href or #strings.endsWith(child.status.href, currentPath)) ? 'dropdown-item active' : 'dropdown-item'}"
            th:target="${child.spec.target?.value}"
          >
            <img
              th:if="${not #strings.isEmpty(child.metadata?.annotations?.get('icon'))}"
              th:src="${child.metadata.annotations.get('icon')}"
              alt=""
            />
            <span class="nav-text" th:text="${child.status.displayName}"></span>
          </a>
        </div>
      </th:block>
      <a
        th:unless="${menuItem.children != null and not #lists.isEmpty(menuItem.children)}"
        th:href="@{${menuItem.status.href}}"
        th:class="${currentPath != null and menuItem.status?.href != null and (currentPath == menuItem.status.href or #strings.endsWith(menuItem.status.href, currentPath)) ? 'sidebar-nav-item active' : 'sidebar-nav-item'}"
        th:target="${menuItem.spec.target?.value}"
      >
        <img
          th:if="${not #strings.isEmpty(menuItem.metadata?.annotations?.get('icon'))}"
          th:src="${menuItem.metadata.annotations.get('icon')}"
          alt=""
        />
        <span class="nav-text" th:text="${menuItem.status.displayName}"></span>
        <span th:if="${menuItem.spec.target?.value == '_blank'}" class="icon-[ph--arrow-up-right] external-tip"></span>
      </a>
    </li>
  </menu>
</th:block>
